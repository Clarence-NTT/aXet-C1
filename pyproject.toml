[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logscope"
version = "0.1.0"
description = "Streaming log analysis CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
logscope = "logscope.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
